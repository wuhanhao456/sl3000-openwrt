name: Build SL-3000 ImmortalWrt 24.10

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            qemu-utils upx-ucl libelf-dev
          df -h

      - name: 克隆 ImmortalWrt 24.10 源码
        run: |
          git clone -b openwrt-24.10 --depth 1 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "源码克隆完成"

      - name: 应用 SL-3000 设备支持
        run: |
          cd openwrt
          # 复制 dts 文件
          cp -r $GITHUB_WORKSPACE/devices/mediatek_filogic/diy/target/linux/mediatek/dts/* \
            target/linux/mediatek/dts/
          # 应用设备注册补丁
          bash $GITHUB_WORKSPACE/scripts/add-sl3000-device.sh
          # 复制无线校准文件到 files/（OpenWrt 编译时自动打包进 rootfs）
          mkdir -p files
          cp -r $GITHUB_WORKSPACE/devices/mediatek_filogic/diy/files/* files/
          echo "SL-3000 设备支持已添加"
          echo "=== files 目录内容 ==="
          find files -type f | sort

      - name: 添加 UA3F / rkp-ipid / passwall2 feed
        run: |
          cd openwrt
          # 添加 UA3F（官方布局：整个仓库放 package/ua3f，
          # Makefile 在 openwrt/ 子目录，用 ../go.mod 引用仓库根的 Go 源码；
          # 若只复制 openwrt/ 子目录会导致 prepare 阶段找不到源码）
          git clone --depth 1 https://github.com/SunBK201/UA3F.git /tmp/UA3F
          cp -r /tmp/UA3F package/ua3f
          # 添加 rkp-ipid（Makefile 在仓库根目录）
          git clone --depth 1 https://github.com/CHN-beta/rkp-ipid.git /tmp/rkp-ipid
          mkdir -p package/rkp-ipid
          cp -r /tmp/rkp-ipid/Makefile /tmp/rkp-ipid/src package/rkp-ipid/
          # 添加 passwall2 及其依赖
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/luci-app-passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          echo "UA3F / rkp-ipid / passwall2 已添加"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 升级 golang feed 到 1.26.8（兼容 passwall2 依赖链）
        run: |
          cd openwrt
          # 24.10 分支 golang 固定 1.23.12，而 passwall2 依赖链
          # （geoview 0.2.6 / sing-box 1.14 / xray-core 26.x）要求 go >= 1.26。
          # OpenWrt 构建强制 GOTOOLCHAIN=local，无法自动下载新工具链，
          # 因此直接把 feeds 里 golang 包版本升级到 1.26.8。
          sed -i 's/^GO_VERSION_MAJOR_MINOR:=1.23$/GO_VERSION_MAJOR_MINOR:=1.26/' \
            feeds/packages/lang/golang/golang/Makefile
          sed -i 's/^GO_VERSION_PATCH:=12$/GO_VERSION_PATCH:=8/' \
            feeds/packages/lang/golang/golang/Makefile
          # go1.26.8.src.tar.gz sha256
          sed -i 's/^PKG_HASH:=e1cce9379a24e895714a412c7ddd157d2614d9edbe83a84449b6e1840b4f1226$/PKG_HASH:=4e39b98e42f946fa05ac8bc5b71877df97dbdb7cbb1a777b541667ad7117fd2e/' \
            feeds/packages/lang/golang/golang/Makefile
          grep -E '^(GO_VERSION_MAJOR_MINOR|GO_VERSION_PATCH|PKG_HASH)' \
            feeds/packages/lang/golang/golang/Makefile
          echo "golang feed 已升级"

      - name: 准备 golang 外部 bootstrap（go1.26 需 >=1.24 编译）
        run: |
          cd openwrt
          # golang feed 自带 bootstrap 链只到 go1.20（1.4 -> 1.17 -> 1.20），
          # 而 go1.26.8 源码要求编译它的 bootstrap 是 go1.24.6+（notgo124.go 检查）。
          # 方案：下载官方 go1.24.13 linux-amd64 预编译包作外部 bootstrap，
          # 并通过 GOLANG_EXTERNAL_BOOTSTRAP_ROOT 配置；同时把 Host/Make 的
          # GOROOT_BOOTSTRAP 指向该外部 bootstrap（本地实测通过）。
          GO_BOOTSTRAP_VER=go1.24.13
          curl -fL --retry 3 -o /tmp/${GO_BOOTSTRAP_VER}.linux-amd64.tar.gz \
            https://dl.google.com/go/${GO_BOOTSTRAP_VER}.linux-amd64.tar.gz
          echo "1fc94b57134d51669c72173ad5d49fd62afb0f1db9bf3f798fd98ee423f8d730  /tmp/${GO_BOOTSTRAP_VER}.linux-amd64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/go-bootstrap
          tar -C /tmp/go-bootstrap --strip-components=1 -xzf /tmp/${GO_BOOTSTRAP_VER}.linux-amd64.tar.gz
          /tmp/go-bootstrap/bin/go version
          # Host 编译 go1.26.8 时直接用外部 bootstrap，跳过 1.20 中间层
          sed -i 's|GOROOT_BOOTSTRAP="\$(BOOTSTRAP_1_20_BUILD_DIR)"|GOROOT_BOOTSTRAP="$(BOOTSTRAP_ROOT_DIR)"|' \
            feeds/packages/lang/golang/golang/Makefile
          grep 'GOROOT_BOOTSTRAP="\$(BOOTSTRAP_ROOT_DIR)"' \
            feeds/packages/lang/golang/golang/Makefile
          echo "外部 bootstrap 就绪"

      - name: 生成 .config
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/config/sl3000.config .config
          # go1.26.8 需要外部 bootstrap（go1.24+）编译自身；
          # 该配置必须存在于 .config，defconfig 才会保留
          echo 'CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT="/tmp/go-bootstrap"' >> .config
          make defconfig
          grep GOLANG_EXTERNAL_BOOTSTRAP_ROOT .config

      - name: 下载依赖
        run: |
          cd openwrt
          # download.pl 自带多源 fallback（libxml2/acl 曾出现单源 404/502，
          # 会自动切换镜像重试）。此处再做整层兜底：
          # 并行下载失败后降级单线程重试，最多 3 轮，防止个别源抖动导致中断
          for attempt in 1 2 3; do
            echo "=== make download 第 $attempt 轮 ==="
            if make download -j$(nproc) V=s; then
              echo "依赖下载完成（第 $attempt 轮）"
              break
            fi
            if make download -j1 V=s; then
              echo "依赖下载完成（第 $attempt 轮，单线程降级）"
              break
            fi
            echo "第 $attempt 轮仍有失败，稍后重试..."
            sleep 30
          done
          # 3 轮后仍有失败则明确报错（避免带残缺 dl/ 进入编译）
          make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          # 编译过程若因下载/资源问题中断，make 增量续编即可恢复；
          # 先并行尝试，失败自动降级单线程重跑一轮
          make -j$(nproc) V=s || make -j1 V=s || (make -j1 V=s && echo "重试后编译完成")

      - name: 收集固件
        run: |
          cd openwrt
          mkdir -p $GITHUB_WORKSPACE/bin
          find bin/targets -name "*.bin" -o -name "*.itb" -o -name "*.fip" -o -name "*.gpt" | while read f; do
            cp "$f" $GITHUB_WORKSPACE/bin/ 2>/dev/null || true
          done
          ls -la $GITHUB_WORKSPACE/bin/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-immortalwrt-24.10
          path: bin/

      - name: 发布 Release（产物自动进可下载版本）
        run: |
          TAG="v$(date +%Y.%m.%d-%H%M)"
          gh release create "$TAG" bin/*.bin \
            --title "SL-3000 ImmortalWrt 24.10 $TAG" \
            --notes "自动构建。本次修复：
          - emmc DTS 增加 SPI NOR 支持，eeprom 改从 NOR Factory 分区读取原厂校准
          - eeprom fallback 文件对齐 mt76 驱动路径 (mediatek/mt7981_eeprom_mt7976_dbdc.bin)
          下载 sl_3000-emmc-squashfs-sysupgrade.bin 后经 U-boot 刷入。" \
            --latest
          echo "Release $TAG 已发布"
