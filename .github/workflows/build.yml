name: Build SL-3000 ImmortalWrt 24.10

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 初始化环境
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            qemu-utils upx-ucl libelf-dev
          df -h

      - name: 克隆 ImmortalWrt 24.10 源码
        run: |
          git clone -b openwrt-24.10 --depth 1 \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "源码克隆完成"

      - name: 应用 SL-3000 设备支持
        run: |
          cd openwrt
          # 复制 dts 文件
          cp -r $GITHUB_WORKSPACE/devices/mediatek_filogic/diy/target/linux/mediatek/dts/* \
            target/linux/mediatek/dts/
          # 应用设备注册补丁
          bash $GITHUB_WORKSPACE/scripts/add-sl3000-device.sh
          echo "SL-3000 设备支持已添加"

      - name: 添加 UA3F / rkp-ipid / passwall2 feed
        run: |
          cd openwrt
          # 添加 UA3F 官方 openwrt 包
          git clone --depth 1 https://github.com/SunBK201/UA3F.git /tmp/UA3F
          cp -r /tmp/UA3F/openwrt package/ua3f
          # 添加 rkp-ipid（Makefile 在仓库根目录）
          git clone --depth 1 https://github.com/CHN-beta/rkp-ipid.git /tmp/rkp-ipid
          mkdir -p package/rkp-ipid
          cp -r /tmp/rkp-ipid/Makefile /tmp/rkp-ipid/src package/rkp-ipid/
          # 添加 passwall2 及其依赖
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/luci-app-passwall2
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/passwall-packages
          echo "UA3F / rkp-ipid / passwall2 已添加"

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 升级 golang feed 到 1.26.8（兼容 passwall2 依赖链）
        run: |
          cd openwrt
          # 24.10 分支 golang 固定 1.23.12，而 passwall2 依赖链
          # （geoview 0.2.6 / sing-box 1.14 / xray-core 26.x）要求 go >= 1.26。
          # OpenWrt 构建强制 GOTOOLCHAIN=local，无法自动下载新工具链，
          # 因此直接把 feeds 里 golang 包版本升级到 1.26.8。
          sed -i 's/^GO_VERSION_MAJOR_MINOR:=1.23$/GO_VERSION_MAJOR_MINOR:=1.26/' \
            feeds/packages/lang/golang/golang/Makefile
          sed -i 's/^GO_VERSION_PATCH:=12$/GO_VERSION_PATCH:=8/' \
            feeds/packages/lang/golang/golang/Makefile
          # go1.26.8.src.tar.gz sha256
          sed -i 's/^PKG_HASH:=e1cce9379a24e895714a412c7ddd157d2614d9edbe83a84449b6e1840b4f1226$/PKG_HASH:=4e39b98e42f946fa05ac8bc5b71877df97dbdb7cbb1a777b541667ad7117fd2e/' \
            feeds/packages/lang/golang/golang/Makefile
          grep -E '^(GO_VERSION_MAJOR_MINOR|GO_VERSION_PATCH|PKG_HASH)' \
            feeds/packages/lang/golang/golang/Makefile
          echo "golang feed 已升级"

      - name: 生成 .config
        run: |
          cd openwrt
          cp $GITHUB_WORKSPACE/config/sl3000.config .config
          make defconfig

      - name: 下载依赖
        run: |
          cd openwrt
          make download -j$(nproc) || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s

      - name: 收集固件
        run: |
          cd openwrt
          mkdir -p $GITHUB_WORKSPACE/bin
          find bin/targets -name "*.bin" -o -name "*.itb" -o -name "*.fip" -o -name "*.gpt" | while read f; do
            cp "$f" $GITHUB_WORKSPACE/bin/ 2>/dev/null || true
          done
          ls -la $GITHUB_WORKSPACE/bin/

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: sl3000-immortalwrt-24.10
          path: bin/
